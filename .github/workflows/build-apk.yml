name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Namma Mane Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Web Application
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor Android Project
        working-directory: frontend
        run: npx cap sync android

      - name: Make Gradle Executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Android APK with Gradle
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename and Prepare APK
        run: |
          mkdir -p release-apk
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk release-apk/NammaMane.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NammaMane-Android-APK
          path: release-apk/NammaMane.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0-android
          name: Namma Mane Android App (Latest Release)
          body: |
            ## 🏠 Namma Mane Mobile App for Android
            
            Install the official Namma Mane app directly on your Android phone!
            
            ### 📥 Download:
            Click **NammaMane.apk** below to download and install on your phone.
            
            ### ✨ Features:
            - Instant zero-brokerage home searches & filters across all 31 Karnataka districts
            - Real-time chat & notifications with property owners
            - Secure digital lease agreements & automated HRA receipts
            - Integrated Razorpay payments
          files: release-apk/NammaMane.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
